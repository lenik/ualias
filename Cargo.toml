[package]
name = "ualias"
version = "0.0.2"
edition = "2021"
description = "Look up or append USB device aliases from /etc/udev/devices"
license = "AGPL-3.0"
repository = "https://github.com/lenik/ualias"
authors = ["Lenik <ualias@bodz.net>"]
rust-version = "1.74"

[lib]
name = "ualias"
path = "src/lib.rs"

[[bin]]
name = "ualias"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["color"] }
gettext-rs = "0.7"
log = "0.4"
thiserror = "1.0"
